version: '3'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /app/frontend/:/usr/share/nginx/html/:ro
      - /etc/letsencrypt/live/rasp.balanci.ng/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/rasp.balanci.ng/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - /app/nginx.conf:/etc/nginx/nginx.conf:ro