events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect HTTP to HTTPS for main domain
    server {
        listen 80;
        server_name rasp.balanci.ng;
        return 301 https://$server_name$request_uri;
    }

    # Redirect HTTP to HTTPS for stats subdomain
    server {
        listen 80;
        server_name stats.rasp.balanci.ng;
        return 301 https://$server_name$request_uri;
    }

    # Main site - React app
    server {
        listen 443 ssl;
        http2 on;
        server_name rasp.balanci.ng;

        ssl_certificate /etc/letsencrypt/live/rasp.balanci.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rasp.balanci.ng/privkey.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Serve React app for all routes
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Stats subdomain - Umami Analytics
    server {
        listen 443 ssl;
        http2 on;
        server_name stats.rasp.balanci.ng;

        ssl_certificate /etc/letsencrypt/live/stats.rasp.balanci.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stats.rasp.balanci.ng/privkey.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Proxy everything to Umami
        location / {
            proxy_pass http://umami:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
